            safeLS.set("gunners_emailModalSeen", "true");
          } else if (exitOpen) {
            setExitOpen(false);
          }
        };
        document.addEventListener("keydown", onEsc);
        return () => document.removeEventListener("keydown", onEsc);
      }, [selected, emailOpen, exitOpen]);

      useEffect(() => {
        if (!anyModalOpen) return;
        const t = setTimeout(() => {
          if (modalCloseRef.current) modalCloseRef.current.focus();
        }, 20);
        return () => clearTimeout(t);
      }, [anyModalOpen]);

      useEffect(() => {
        if (safeLS.get("gunners_emailModalSeen", "false") === "true") return;
        if (safeLS.get("gunners_emailCaptured", "false") === "true") return;

        let shown = false;
        const show = () => {
          if (shown) return;
          shown = true;
          setEmailOpen(true);
          safeLS.set("gunners_emailModalSeen", "true");
          trackEvent("email_popup_shown");
        };

        const timer = setTimeout(show, 12000);
        const onScroll = () => {
          const max = document.body.scrollHeight - window.innerHeight || 1;
          const pct = window.scrollY / max;
          if (pct > 0.4) {
            show();
            window.removeEventListener("scroll", onScroll);
          }
        };

        window.addEventListener("scroll", onScroll, { passive: true });
        return () => {
          clearTimeout(timer);
          window.removeEventListener("scroll", onScroll);
        };
      }, []);

      useEffect(() => {
        if (safeLS.get("gunners_exitShown", "false") === "true") return;

        let shown = false;
        const trigger = () => {
          if (shown) return;
          shown = true;
          setExitOpen(true);
          safeLS.set("gunners_exitShown", "true");
          trackEvent("exit_popup_shown");
        };

        const onLeave = (e) => {
          if (e.clientY <= 0 && !e.relatedTarget) trigger();
        };

        if (window.innerWidth > 800) {
          document.addEventListener("mouseout", onLeave);
          return () => document.removeEventListener("mouseout", onLeave);
        }

        const timer = setTimeout(() => {
          if (window.scrollY > 120 || !hasAccess) trigger();
        }, 24000);

        return () => clearTimeout(timer);
      }, [hasAccess]);

      const items = useMemo(() => {
        const query = q.trim().toLowerCase();
        let out = [...allItems].filter((i) => {
          const hit = `${i.title} ${i.teaser} ${i.body}`.toLowerCase();
          return (cat === "all" || i.category === cat) && (era === "all" || i.era === era) && (!query || hit.includes(query));
        });

        if (sort === "a-z") out.sort((a, b) => a.title.localeCompare(b.title));
        if (sort === "category") out.sort((a, b) => `${a.category} ${a.title}`.localeCompare(`${b.category} ${b.title}`));
        if (sort === "featured") out.sort((a, b) => (b.featured - a.featured) || a.title.localeCompare(b.title));

        return out;
      }, [allItems, q, cat, era, sort]);

      const copyText = async (txt, okMsg = "Copied to clipboard") => {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(txt);
          } else {
            const helper = document.createElement("textarea");
            helper.value = txt;
            helper.setAttribute("readonly", "");
            helper.style.position = "absolute";
            helper.style.left = "-9999px";
            document.body.appendChild(helper);
            helper.select();
            document.execCommand("copy");
            document.body.removeChild(helper);
          }
          setToast(okMsg);
          return true;
        } catch {
          setToast("Copy failed. Please copy manually.");
          return false;
        }
      };

      const pieceShareText = (item) => `Check out "${item.title}" in The Gunners Vault — Arsenal nostalgia and stories.`;

      const share = (net, text, url = pageUrl) => {
        const links = {
          x: `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`,
          fb: `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}&quote=${encodeURIComponent(text)}`,
          wa: `https://wa.me/?text=${encodeURIComponent(`${text} ${url}`)}`
        };

        const target = links[net];
        if (!target) {
          copyText(`${text} ${url}`);
          return;
        }

        const popup = window.open(target, "_blank", "noopener,noreferrer,width=620,height=520");
        if (!popup) {
          copyText(`${text} ${url}`, "Popup blocked. Share text copied.");
        }

        trackEvent("share_click", { network: net });
      };

      const doBuy = (src) => {
        trackEvent("purchase_click", { src });
        setIsBuying(src);
        const w = window.open(PAYMENT_URL, "_blank", "noopener,noreferrer");
        if (!w) {
          setToast("Checkout popup blocked. Please allow popups.");
        } else {
          setToast("Checkout opened in new tab");
        }
        setTimeout(() => setIsBuying(""), 900);
      };

      const unlockDemo = () => {
        setHasAccess(true);
        setToast("Vault unlocked on this device");
        trackEvent("manual_unlock");

      const submitEmail = (e) => {
        e.preventDefault();
        const clean = email.trim();
        const ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(clean);

          setEmailErr("Please enter a valid email address.");
          return;

        setEmailOk(true);
        safeLS.set("gunners_emailCaptured", "true");
        safeLS.set("gunners_emailValue", clean);
        safeLS.set("gunners_emailModalSeen", "true");
        trackEvent("email_captured");

        safeLS.set("gunners_emailModalSeen", "true");

        setExitOpen(false);

      const startQuiz = () => {
        setQuizStart(true);
        setQuizDone(false);
        setQi(0);
        setAns([]);
        setChoice(null);
        setScore(0);
        setQErr("");

      const nextQuiz = () => {
        if (choice === null) {
          setQErr("Pick an answer before continuing.");
          return;

        setAns(next);
        setChoice(null);
        setQErr("");

        if (qi === quizData.questions.length - 1) {

            const s = next.reduce((t, a, i) => t + (a === quizData.questions[i].a ? 1 : 0), 0);
            setScore(s);
            setQuizDone(true);
            setQuizLoading(false);
            const nextBest = Math.max(s, bestScore);
            setBestScore(nextBest);

            trackEvent("quiz_completed", { score: s });

      const tier = score >= 9 ? "Legend" : score >= 6 ? "Proper Gooner" : "Rising Gooner";

                          <div className="meta">
                            <span className="tag-pill">{item.category}</span>
                            <span className="tag-pill">{item.era}</span>
                            <span className="tag-pill lock">{unlocked ? "Unlocked" : "Locked"}</span>

                          <h3>{item.title}</h3>
                          <p>{item.teaser}</p>

                          <div className="row end">

                            <button type="button" className="share" onClick={() => share("fb", pieceShareText(item), `${pageUrl}#piece-${item.shareSlug}`)} aria-label={`Share ${item.title} on Facebook`}>Facebook</button>
                            <button type="button" className="share" onClick={() => share("wa", pieceShareText(item), `${pageUrl}#piece-${item.shareSlug}`)} aria-label={`Share ${item.title} on WhatsApp`}>WhatsApp</button>
                          </div>
                        </article>
                      );
                    })}
                  </div>
                )}

                {!loading && items.length === 0 && (
                  <div className="empty" role="status" aria-live="polite">
                    <p style={{ marginTop: 0, marginBottom: 10 }}><strong>No results found.</strong> Try broader terms or reset filters.</p>
                    <button type="button" className="btn small" onClick={resetFilters}>Reset Filters</button>
                  </div>
                )}
              </div>
            </section>

            <section className="section" id="quiz" aria-labelledby="quiz-heading">
              <div className="wrap">
                <h2 id="quiz-heading">Arsenal History Quiz</h2>
                <div className="card quizWrap">
                  {!quizStart && !quizDone && (
                    <>
                      <p>{quizData.description} Finish and share your result with friends.</p>
                      <button type="button" className="btn" onClick={startQuiz}>Start 10-Question Quiz</button>
                    </>

                  {quizStart && !quizDone && !quizLoading && (
                    <>
                      <div className="row" style={{ justifyContent: "space-between", marginBottom: 8 }}>
                        <div className="muted">Q{qi + 1} of {quizData.questions.length}</div>
                        <div className="smallNote">Progress: {Math.round(((qi + 1) / quizData.questions.length) * 100)}%</div>
                      </div>

                      <div className="bar" aria-hidden="true" style={{ marginBottom: 12 }}>
                        <div className="fill" style={{ width: `${((qi + 1) / quizData.questions.length) * 100}%` }} />
                      </div>

                      <p className="q">{quizData.questions[qi].q}</p>

                      <div className="opts" role="radiogroup" aria-label={`Question ${qi + 1}`}>
                        {quizData.questions[qi].o.map((op, i) => (
                          <button
                            key={i}
                            type="button"
                            className={`opt ${choice === i ? "sel" : ""}`}

                            aria-pressed={choice === i}
                          >
                            {op}
                          </button>
                        ))}
                      </div>

                      {qErr && <p style={{ color: "#b10017", marginBottom: 0 }}>{qErr}</p>}

                      <div className="row" style={{ marginTop: 12 }}>
                        <button type="button" className="btn" onClick={nextQuiz}>
                          {qi === quizData.questions.length - 1 ? "Submit Quiz" : "Next Question"}
                        </button>
                      </div>
                    </>
                  )}

                  {quizLoading && <div className="loader" role="status">Calculating your score...</div>}

                  {quizDone && (
                    <>
                      <h3>You scored {score}/10 — {tier}</h3>
                      <p className="muted">Best on this device: {bestScore}/10</p>

                      <div className="row">
                        <button type="button" className="share" onClick={() => share("x", quizShare)}>Share on X</button>
                        <button type="button" className="share" onClick={() => share("fb", quizShare)}>Share on Facebook</button>

                      </div>

                    <button type="button" className="btn small" onClick={() => { copyText(`${pageUrl}?ref=gunners-vault`, "Referral link copied"); trackEvent("ref_link_copy"); }}>Copy</button>
                    <button type="button" className="btn small" onClick={() => { setRefCount((prev) => clamp(prev + 1, 0, REF_TARGET)); trackEvent("ref_increment", { count: refCount + 1 }); }} disabled={bonusUnlocked}>
